name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  infra:
    name: Deployment checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.6
      - run: bash scripts/check-infra.sh
      - run: |
          terraform -chdir=infra/openbao fmt -check
          terraform -chdir=infra/openbao init -backend=false -lockfile=readonly
          terraform -chdir=infra/openbao validate

  test:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: gasolinerabot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:test-only-password@localhost:5432/gasolinerabot_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: |
          test -z "$(gofmt -l cmd internal)"
          go mod tidy -diff
          go vet ./...
          go test -race -shuffle=on -count=1 -timeout=5m ./...
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  image:
    name: Image
    needs: [infra, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA:0:8}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 --build-arg VERSION="$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$image" .
      - name: Test image
        run: bash scripts/smoke-image.sh "$IMAGE"
      - name: Reserve version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          minimum="$(sed -n 's/^version: //p' infra/chart/Chart.yaml)"
          # Creating the tag is atomic. A concurrent run that takes the same version makes it fail.
          for _ in 1 2 3 4 5; do
            version="$(git ls-remote --tags --refs origin | sed 's|.*refs/tags/||' | .github/next-version.sh "$minimum")"
            if gh api "repos/$GITHUB_REPOSITORY/git/refs" --silent -f "ref=refs/tags/v$version" -f "sha=$GITHUB_SHA"; then
              echo "VERSION=$version" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "Could not reserve a version" >&2
          exit 1
      - name: Publish image and chart
        if: env.VERSION != ''
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release="${IMAGE%:*}:$VERSION"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE" "$release"
          docker push "$release"
          docker image inspect --format '{{index .RepoDigests 0}}' "$release" >> "$GITHUB_STEP_SUMMARY"
          # The chart goes last: Flux deploys a chart version as soon as it exists.
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm package infra/chart --version "$VERSION" --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/gasolinerabot-$VERSION.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
