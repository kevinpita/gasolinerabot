# Enable only after the bot code, image, and token are ready.
deployment:
  enabled: false

image:
  repository: ghcr.io/kevinpita/gasolinerabot
  tag: <pending>
  digest: ""
  pullPolicy: IfNotPresent

existingSecret: gasolinerabot-secrets
imagePullSecrets: []

openbao:
  enabled: false
  server: https://bao.kevinpita.com
  # Shared by Terraform. Must be accepted by the Kubernetes API.
  audience: "https://kubernetes.default.svc.cluster.local"

# The Go bot serves /healthz and /readyz on port 8080.
health:
  enabled: true

# Enable with the initial deployment. One small, namespace-local database.
postgresql:
  enabled: false
  image: docker.io/library/postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
  storage: 2Gi
  # Empty uses the cluster default StorageClass.
  storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

tmpSizeLimit: 64Mi
resources:
  requests:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 256Mi
  limits:
    cpu: 256m
    memory: 1Gi
    ephemeral-storage: 2Gi
